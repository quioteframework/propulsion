name: Release

# Tag-triggered: push a `v*.*.*` tag (e.g. `v1.2.0`) to run the full test
# suite, generate a changelog with git-cliff scoped to just the commits
# belonging to that tag, and publish a GitHub Release with that changelog as
# its body. The release step only runs if the test suite passes, so a broken
# build never gets released.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # git-cliff needs the full commit/tag history to scope the
          # changelog to "everything since the previous tag" -- the default
          # shallow checkout only has the tagged commit itself.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        working-directory: test
        env:
          # This is the gate on publishing, so it must not be possible to pass it
          # by skipping. Without this a testcontainer that failed to start would
          # skip the whole integration tier, report "OK, but some tests were
          # skipped!", and the release would go out on a suite that never ran.
          PROPULSION_REQUIRE_INTEGRATION: '1'
        run: ../vendor/bin/phpunit -c phpunit.xml

      - name: Assemble release notes
        # Two sources, checked in this order:
        #
        #  1. `.github/release-notes/<tag>.md`, if it exists. This is the escape
        #     hatch for a tag whose history git-cliff cannot summarise usefully --
        #     v2.0.0, whose 201 commits predate this repo's conventional-commit
        #     convention, so `filter_unconventional` drops almost all of them.
        #     Its notes are the curated CHANGELOG.md section instead.
        #  2. git-cliff otherwise. Downloaded standalone rather than via a
        #     third-party composite action: full control over the exact
        #     invocation instead of trusting an action's env-var/output contract.
        #     --current scopes the output to just the commits belonging to the
        #     tag that triggered this run (not the entire project history, which
        #     `--tag` alone would include on every release).
        #
        # Keyed off the tag name rather than an `if:` per tag, so adding notes
        # for a future release is a matter of dropping the file in -- and there
        # is no pair of conditions that can drift apart and leave the body empty.
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "Using hand-written release notes: $NOTES"
            cp "$NOTES" /tmp/release-notes.md
          else
            echo "Generating release notes with git-cliff"
            GIT_CLIFF_VERSION="2.13.1"
            curl -sSL -o /tmp/git-cliff.tar.gz \
              "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            tar -xzf /tmp/git-cliff.tar.gz -C /tmp
            "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" --current --strip header -o /tmp/release-notes.md
          fi
          # An empty body is always a mistake -- either the tag has no
          # conventional commits behind it, or the notes file was misnamed.
          # Fail here rather than publishing a release with a blank description.
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::Release notes for ${GITHUB_REF_NAME} are empty."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
