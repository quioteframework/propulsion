name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (no Docker)
    runs-on: ubuntu-latest
    # Blocking: PROPULSION_SKIP_INTEGRATION=1 used to error out on ~77 tests that
    # depended on the Docker-built fixtures without being properly guarded/decoupled
    # (see KNOWN_ISSUES.md for the fix and how those tests were triaged). This tier
    # now agrees exactly with the "integration" job below on errors/failures, and
    # both are green: the 2 MssqlPlatformTest failures this comment used to record
    # as pre-existing were fixed during the MSSQL parity work.
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml, apcu
          # ApcuCacheTest skips itself unless APCu is usable, so without
          # apc.enable_cli the whole driver would be silently untested here --
          # a green run that proved nothing.
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit (unit tier only)
        working-directory: test
        env:
          # Skips every test that needs the shared Postgres testcontainer (Bookstore/
          # Cms/Namespace/Schemas fixtures and anything built on them -- ~1100+ test
          # methods, markTestSkipped() individually) instead of spending the time to
          # pull postgres:latest and build fixtures just for a fast smoke-test job.
          # Full coverage, including those tests, runs in the "integration" job below.
          PROPULSION_SKIP_INTEGRATION: '1'
        run: ../vendor/bin/phpunit -c phpunit.xml

  integration:
    name: Full suite (with Docker/Postgres)
    runs-on: ubuntu-latest
    # Blocking: this is the source of truth for suite health (see
    # KNOWN_ISSUES.md), and the source of the coverage number reported to Codecov.
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          # pcov, not xdebug. This job used to use xdebug because pcov "silently
          # instruments nothing on PHP 8.5 -- a 0.00% report regardless of what
          # actually ran". That diagnosis was wrong: pcov 1.0.12 works fine on
          # 8.5, but only instruments files under `pcov.directory`, which
          # defaults to the *working directory* -- and every job below runs
          # PHPUnit from `test/`, while the code being measured is in
          # `../runtime/Lib` and `../generator/Lib`. So pcov was faithfully
          # reporting 0% of the nothing it had been pointed at. Hence the
          # explicit -d on the run line; do not drop it.
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own Postgres testcontainer)
        working-directory: test
        env:
          # An unavailable container must fail this job, not skip its way to green.
          PROPULSION_REQUIRE_INTEGRATION: '1'
        run: php -d pcov.directory=${{ github.workspace }} ../vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test/coverage/clover.xml
          # Flagged per platform so Codecov merges the five DB jobs' reports
          # into one number instead of the last upload winning. Without this
          # the reported figure was a Postgres-only run, which systematically
          # understated exactly the code most likely to break: the per-platform
          # adapters (measured on one such run: MSSQL 34%, Oracle 32%, MySQL
          # 50%, against Postgres 75% and SQLite 94% -- all of them fully
          # exercised, just in jobs whose coverage was thrown away).
          flags: postgres
          fail_ci_if_error: true

  integration-mysql:
    name: Full suite (with Docker/MySQL)
    runs-on: ubuntu-latest
    # Blocking: brought to 0 failures during the 2026-07-27 MySQL parity audit (see
    # KNOWN_ISSUES.md) -- the ~32 errors from Postgres-only generator/reverse-
    # engineering test suites (which always open their own independent Postgres
    # testcontainer regardless of PROPULSION_TEST_DB) are pre-existing, unrelated,
    # and were flaky under container-resource contention in that audit; if this job
    # goes red only on those suites, that's the known issue, not a MySQL regression.
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          # See the integration job above for why pcov needs an explicit
          # pcov.directory on the run line.
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own MySQL testcontainer)
        working-directory: test
        env:
          PROPULSION_TEST_DB: mysql
          PROPULSION_REQUIRE_INTEGRATION: '1'
        run: php -d pcov.directory=${{ github.workspace }} ../vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test/coverage/clover.xml
          flags: mysql
          fail_ci_if_error: true

  integration-mariadb:
    name: Full suite (with Docker/MariaDB)
    runs-on: ubuntu-latest
    # Blocking: 0 errors/0 failures on a clean local run of the whole suite
    # against mariadb:11 (2026-08-05), verified alongside Postgres and MySQL runs
    # of the same tree so a failure here means MariaDB, not a general regression.
    #
    # This tier exists because MariaDB is not "MySQL, near enough" to this
    # codebase: DBMySQL::isMariaDb() probes the live server's version string and
    # gates real behaviour on it -- RETURNING for INSERT and for
    # UPDATE/DELETE ... RETURNING, which MySQL proper has no equivalent of -- and
    # MysqlPlatform has MariaDB-only opt-ins (CREATE SEQUENCE, native UUID). None
    # of that executes under PROPULSION_TEST_DB=mysql, so until this job existed
    # every one of those paths was covered only by whoever remembered to run
    # `PROPULSION_TEST_DB=mariadb` by hand.
    #
    # It earned itself immediately: the first run found a test correlating an
    # EXISTS subquery as `Review.BookId = Book.Id`, which passes on Postgres only
    # because unquoted identifiers fold to lower case there. MySQL-family servers
    # on Linux do not fold table names, so it was an "Unknown column" error -- and
    # it would have broken the MySQL, MSSQL and Oracle jobs too, not just this one.
    #
    # No MariadbContainer module ships in testcontainers/testcontainers, so
    # IntegrationDatabase builds one on GenericContainer; see that class for why
    # (the healthcheck binary is mariadb-admin, not mysqladmin).
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # Same driver as real MySQL: there is no separate pdo_mariadb.
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          # See the integration job above for why pcov needs an explicit
          # pcov.directory on the run line.
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own MariaDB testcontainer)
        working-directory: test
        env:
          PROPULSION_TEST_DB: mariadb
          PROPULSION_REQUIRE_INTEGRATION: '1'
        run: php -d pcov.directory=${{ github.workspace }} ../vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test/coverage/clover.xml
          flags: mariadb
          fail_ci_if_error: true

  integration-mssql:
    name: Full suite (with Docker/MSSQL)
    runs-on: ubuntu-latest
    # Blocking: brought to 0 errors/0 failures during the 2026-07-28 MSSQL parity
    # audit (see KNOWN_ISSUES.md) -- verified reproducible across three consecutive
    # full runs. If this job goes red, treat it as a real regression, not a known
    # flake (unlike integration-mysql's Postgres-only-suite caveat above).
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, pdo_dblib, mbstring, xml, simplexml
          # See the integration job above for why pcov needs an explicit
          # pcov.directory on the run line.
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own MSSQL testcontainer)
        working-directory: test
        env:
          PROPULSION_TEST_DB: mssql
          PROPULSION_REQUIRE_INTEGRATION: '1'
        run: php -d pcov.directory=${{ github.workspace }} ../vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test/coverage/clover.xml
          flags: mssql
          fail_ci_if_error: true

  integration-oracle:
    name: Full suite (with Docker/Oracle)
    runs-on: ubuntu-latest
    # Blocking: brought to 0 errors/0 failures during the 2026-07-28 Oracle parity
    # audit (see KNOWN_ISSUES.md), including a genuine PHP-process segfault and
    # several real runtime/generator bugs found and fixed along the way -- verified
    # reproducible across a clean full run plus 0 regressions on Postgres/MySQL/
    # MSSQL. If this job goes red, treat it as a real regression.
    #
    # pdo_oci isn't distributed as a prebuilt package for any current PHP version
    # (unlike pdo_pgsql/pdo_mysql/pdo_dblib above) -- see IntegrationDatabase's own
    # docblock -- so it's built here from PECL against a downloaded Instant Client,
    # the same way local setup is documented there.
    #
    # Oracle retires old Instant Client download paths/filenames as patch releases
    # ship (observed: 2326000/...-23.26.0.0.0dbru.zip 404ing once 23.26.3 shipped,
    # replaced by 2326300/...-23.26.3.0.0.zip -- both the version directory and the
    # filename's patch/suffix convention shifted). If this step 404s, check
    # https://www.oracle.com/database/technologies/instant-client/linux-x86-64-downloads.html
    # for the current Basic/SDK URLs and update both curl lines (and the cache key)
    # below -- the extracted directory name (instantclient_23_26/) and therefore the
    # --with-pdo-oci=instantclient,...,23.26 version argument in the next step are
    # unaffected by patch-level bumps within the same 23.26.x line.
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          # See the integration job above for why pcov needs an explicit
          # pcov.directory on the run line.
          coverage: pcov

      - name: Cache Oracle Instant Client download
        id: instantclient-cache
        uses: actions/cache@v4
        with:
          path: /opt/oracle/instantclient
          # The -v2 suffix invalidates caches saved by earlier runs, which stored
          # a *partial* extraction (see the unzip -o note below). Without it a
          # cache hit would restore the broken tree and skip the download step
          # entirely, so the fix would never take effect. Bump this whenever the
          # extraction changes shape, not just when the version does.
          key: instantclient-23.26.3-linux-x64-v2

      - name: Download Oracle Instant Client (Basic + SDK)
        if: steps.instantclient-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/oracle/instantclient
          cd /opt/oracle/instantclient
          curl -fsSL -o basic.zip https://download.oracle.com/otn_software/linux/instantclient/2326300/instantclient-basic-linux.x64-23.26.3.0.0.zip
          curl -fsSL -o sdk.zip https://download.oracle.com/otn_software/linux/instantclient/2326300/instantclient-sdk-linux.x64-23.26.3.0.0.zip
          # -o (overwrite) is required, not cosmetic: both archives contain
          # META-INF/MANIFEST.MF, so the second unzip stops to ask whether to
          # replace it. There is no TTY on a runner, so it reads EOF, answers
          # "[N]one", and silently skips the *rest of the archive* -- the SDK
          # headers never land and the ./configure below then fails with no
          # obvious cause. -q only suppresses the file listing, not the prompt.
          sudo unzip -q -o basic.zip
          sudo unzip -q -o sdk.zip
          sudo cp -a instantclient_23_26/. .
          sudo rm -rf instantclient_23_26 META-INF
          sudo rm basic.zip sdk.zip
          # Fail loudly here rather than in ./configure if the SDK is incomplete.
          test -f sdk/include/oci.h

      - name: Build and install pdo_oci
        run: |
          # Ubuntu 24.04's libaio1t64 package rename (64-bit time_t) means the
          # Instant Client's own libaio.so.1 dependency needs this compat symlink.
          sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1
          pecl download pdo_oci
          tar xzf pdo_oci-*.tgz
          cd pdo_oci-*/
          phpize
          ./configure --with-pdo-oci=instantclient,/opt/oracle/instantclient,23.26
          make -j"$(nproc)"
          sudo cp modules/pdo_oci.so "$(php-config --extension-dir)/pdo_oci.so"
          # Put the Instant Client on the loader's search path for every later
          # step and every process, not just the phpunit one.
          #
          # pdo_oci.so links against libclntsh.so with an rpath of
          # /opt/oracle/instantclient, but modern binutils emits DT_RUNPATH
          # rather than DT_RPATH, and RUNPATH applies *only* to the direct
          # dependencies of the object carrying it. libclntsh.so is found;
          # libnnz.so -- which libclntsh.so itself needs, and which carries no
          # rpath of its own -- is not, so loading fails with
          # "libnnz.so: cannot open shared object file". DT_RPATH would have
          # been inherited transitively; DT_RUNPATH is not.
          #
          # ldconfig fixes it for the whole machine, which matters because the
          # `php -m` verification below and `composer install` both run in steps
          # that have no LD_LIBRARY_PATH. Setting that variable per-step is what
          # this job did before, and it left the verification line failing on a
          # build that had actually succeeded.
          echo /opt/oracle/instantclient | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig
          ldconfig -p | grep -q libclntsh || { echo "Instant Client is not on the loader path"; exit 1; }
          # The scan directory is read from PHP itself rather than scraped out of
          # `php --ini`. PHP 8.5 quotes the paths in that output ("Scan for
          # additional .ini files in: "/etc/php/8.5/cli/conf.d""), so the previous
          # `sed 's/.*: //'` captured the surrounding double quotes as part of the
          # value and tee then failed with "No such file or directory" on a path
          # that had quotes embedded in it. PHP_CONFIG_FILE_SCAN_DIR is the same
          # value as a plain string with no formatting to parse; the PHP_INI_SCAN_DIR
          # environment variable takes precedence over it when set, so it is
          # honoured first.
          SCAN_DIR="${PHP_INI_SCAN_DIR:-$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')}"
          test -n "$SCAN_DIR" || { echo "Could not determine the PHP ini scan directory"; exit 1; }
          sudo mkdir -p "$SCAN_DIR"
          echo "extension=pdo_oci.so" | sudo tee "$SCAN_DIR/80-pdo_oci.ini"
          php -m | grep -i pdo_oci

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own Oracle testcontainer)
        working-directory: test
        env:
          PROPULSION_TEST_DB: oracle
          PROPULSION_REQUIRE_INTEGRATION: '1'
        run: php -d pcov.directory=${{ github.workspace }} ../vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test/coverage/clover.xml
          flags: oracle
          fail_ci_if_error: true

  analyse:
    name: PHPStan (level 9, hand-written + generated)
    runs-on: ubuntu-latest
    # CLAUDE.md requires every edited file to reach PHPStan level 9, but nothing
    # enforced it mechanically -- this job turns that rule from discipline into
    # a gate, for the generated model classes as much as for the source that
    # emits them. Generated code reached zero findings at level 9 in 2026-08
    # (down from 550); without this job nothing would notice it drifting back,
    # because the generated tree is never committed and so never reviewed.
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Run first, and on its own, so a failure in hand-written code reports
      # against generator/runtime/bin rather than arriving mixed into a run that
      # also covers 450-odd generated files.
      - name: Run PHPStan over hand-written code
        run: composer analyse

      # Only the bookstore project builds without a database; the namespaced and
      # schemas projects are Postgres-specific, so this starts a testcontainer.
      # PROPULSION_REQUIRE_INTEGRATION makes an unavailable one a failure rather
      # than a skip -- a partial tree would leave the gate below analysing a
      # fraction of the code and reporting success. The script additionally
      # refuses to exit 0 on a tree that has collapsed, for the same reason.
      - name: Generate fixture model classes
        env:
          PROPULSION_REQUIRE_INTEGRATION: '1'
        run: composer test:generate-fixtures

      - name: Run PHPStan over generated code
        run: composer analyse:generated

      - name: Clean up leaked test containers
        if: always()
        run: composer test:cleanup-containers

  worker:
    name: FrankenPHP worker-mode matrix
    runs-on: ubuntu-latest
    # The worker suite is the only place the headline property of the global
    # query cache is provable -- that an entry written by one request is still
    # there for the next, while the request-scoped tier is not. It also covers
    # the request-boundary safety guarantees the whole Phase 4 rework exists for.
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, mbstring, xml, simplexml, curl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run worker-mode matrix
        run: composer test:worker

      - name: Clean up leaked test containers
        if: always()
        run: composer test:cleanup-containers
