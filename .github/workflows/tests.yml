name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (no Docker)
    runs-on: ubuntu-latest
    # Blocking: PROPULSION_SKIP_INTEGRATION=1 used to error out on ~77 tests that
    # depended on the Docker-built fixtures without being properly guarded/decoupled
    # (see KNOWN_ISSUES.md for the fix and how those tests were triaged). This tier
    # now agrees exactly with the "integration" job below on errors/failures (both
    # currently have the same 2 pre-existing MssqlPlatformTest failures -- also
    # tracked in KNOWN_ISSUES.md, unrelated to Docker availability).
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit (unit tier only)
        working-directory: test
        env:
          # Skips every test that needs the shared Postgres testcontainer (Bookstore/
          # Cms/Namespace/Schemas fixtures and anything built on them -- ~1100+ test
          # methods, markTestSkipped() individually) instead of spending the time to
          # pull postgres:latest and build fixtures just for a fast smoke-test job.
          # Full coverage, including those tests, runs in the "integration" job below.
          PROPULSION_SKIP_INTEGRATION: '1'
        run: ../vendor/bin/phpunit -c phpunit.xml

  integration:
    name: Full suite (with Docker/Postgres)
    runs-on: ubuntu-latest
    # Blocking: this is the source of truth for suite health (see
    # KNOWN_ISSUES.md), and the source of the coverage number reported to Codecov.
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          # Blocking: pcov (as of 1.0.12) silently instruments nothing on PHP 8.5 --
          # no error, just a 0.00% report regardless of what actually ran. Xdebug's
          # coverage driver works correctly on the same PHP build, so use that
          # instead even though it's slower; see KNOWN_ISSUES.md.
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own Postgres testcontainer)
        working-directory: test
        env:
          XDEBUG_MODE: coverage
        run: ../vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test/coverage/clover.xml
          fail_ci_if_error: true

  integration-mysql:
    name: Full suite (with Docker/MySQL)
    runs-on: ubuntu-latest
    # Blocking: brought to 0 failures during the 2026-07-27 MySQL parity audit (see
    # KNOWN_ISSUES.md) -- the ~32 errors from Postgres-only generator/reverse-
    # engineering test suites (which always open their own independent Postgres
    # testcontainer regardless of PROPULSION_TEST_DB) are pre-existing, unrelated,
    # and were flaky under container-resource contention in that audit; if this job
    # goes red only on those suites, that's the known issue, not a MySQL regression.
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring, xml, simplexml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own MySQL testcontainer)
        working-directory: test
        env:
          PROPULSION_TEST_DB: mysql
        run: ../vendor/bin/phpunit -c phpunit.xml

  integration-mssql:
    name: Full suite (with Docker/MSSQL)
    runs-on: ubuntu-latest
    # Blocking: brought to 0 errors/0 failures during the 2026-07-28 MSSQL parity
    # audit (see KNOWN_ISSUES.md) -- verified reproducible across three consecutive
    # full runs. If this job goes red, treat it as a real regression, not a known
    # flake (unlike integration-mysql's Postgres-only-suite caveat above).
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, pdo_dblib, mbstring, xml, simplexml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full PHPUnit suite (starts its own MSSQL testcontainer)
        working-directory: test
        env:
          PROPULSION_TEST_DB: mssql
        run: ../vendor/bin/phpunit -c phpunit.xml
